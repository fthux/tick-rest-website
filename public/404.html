<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — Tick Rest</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #252a25; background: #faf9f6; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
      main { max-width: 36rem; padding: 3rem 1.5rem; text-align: center; }
      .brand { font-weight: 600; letter-spacing: .04em; }
      .status { color: #58634e; font-size: 5rem; font-weight: 600; margin: 2rem 0 0; }
      h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); letter-spacing: -.04em; }
      p { line-height: 1.7; }
      nav { display: flex; justify-content: center; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
      a { padding: .85rem 1.25rem; border-radius: 999px; background: #e8eddf; color: #283b24; text-decoration: none; font-weight: 500; }
      a:hover { background: #dbe3cf; }
      a:focus-visible { outline: 2px solid #47623c; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Tick Rest</p>
      <p class="status">404</p>
      <h1>Page not found.</h1>
      <p>This page may have moved, or the link may be incorrect.</p>
      <nav aria-label="Return to the website">
        <a href="/">Back to home</a>
      </nav>
    </main>
  </body>
</html>
